<!DOCTYPE html>
<html lang="en">
<html xmls:th="http://www.thymeleaf.org"></html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>

    
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center index-body">

    <div class="bg-[#28002b] text-gray-500 max-w-md w-full mx-4 md:p-8 p-6 text-left rounded-xl shadow-lg">

        <h1 class="text-3xl font-bold text-center text-white mb-2 fpl-analytics-header">
            FPL Analytics
        </h1>

        <p class="text-center text-white font-bold mb-8">
            Search for any Premier League player
        </p>

        <form action="/player" method="get">

            <label for="name" class="block mb-2 font-medium text-white index-player-name">
                Player Name
            </label>

            <input
                id="name"
                name="name" required oninvalid="this.setCustomValidity('Please enter a player name!')" oninput="this.setCustomValidity('')"
                type="text"
                placeholder="e.g. Saka, Palmer, Haaland"
                class="w-full border border-gray-300 focus:border-indigo-500 outline-none rounded-lg py-3 px-4">

            <button
                type="submit"
                class="w-full mt-5 bg-[#41054b] hover:bg-indigo-700 active:scale-95 transition py-3 rounded-lg text-white font-medium">

                Search Player

            </button>

        </form>


    </div>

</body>
</html>
