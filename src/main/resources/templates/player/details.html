<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-[#28002b] text-gray-500 max-w-md w-full mx-4 md:p-8 p-6 text-left rounded-xl shadow-lg">

        <h1 class="text-5xl text-white font-bold mb-6 flex items-center justify-center player-details-text">
            Player Details
        </h1>

        <!-- Error Message -->
        <div th:if="${playerNotFoundMsg}" 
            class="mt-4 text-center text-red-600 font-bold">
            Error:
            Player '<span th:text="${playerName}"></span>'
            <span th:text="${playerNotFoundMsg}"></span>
        </div>

        <!-- Player Details -->
        <div th:if="${player}" class="mt-8 border-t pt-6 text-center">

            <h2 class="text-2xl font-bold text-white text-center"
                th:text="${player.webName}">
            </h2>

             <h4 class="text-lg font-bold mt-2 text-white text-center"
                th:text="${player.teamName}">
            </h4>

            <div class="text-white">
                <p class="mt-2 text-center">
                    Points:
                    <span th:text="${player.totalPoints}"></span>
                </p>

                <p>
                    Price:
                    £<span th:text="${player.nowCost / 10.0}"></span>m
                </p>

                <p>
                    Goals Scored This Season:
                    <span th:text="${player.goalsScored}"></span>
                </p>

                <p>
                    Assist This Season:
                    <span th:text="${player.assists}"></span>
                </p>
            </div>

        </div>

    </div>

    
    
</body>
</html>
