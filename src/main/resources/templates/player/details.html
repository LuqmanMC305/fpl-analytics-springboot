<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Player Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white text-gray-500 max-w-md w-full mx-4 md:p-8 p-6 text-left rounded-xl shadow-lg">

        <h1 class="text-4xl font-bold mb-6 flex items-center justify-center">
            Player Details
        </h1>

        <!-- Player Details -->
        <div th:if="${player}" class="mt-8 border-t pt-6 text-center">

            <h2 class="text-2xl font-bold text-gray-800 text-center"
                th:text="${player.webName}">
            </h2>

            <p class="mt-2 text-center">
                Points:
                <span th:text="${player.totalPoints}"></span>
            </p>

            <p>
                Price:
                £<span th:text="${player.nowCost / 10.0}"></span>m
            </p>

        </div>

    </div>

    
    
</body>
</html>
